name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. A library gets installed into applications whose PHP
        # version nobody consulted us about, so both ends have to stay green.
        php: ['8.1', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Lint every source file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Test
        run: composer test

      - name: Static analysis
        run: composer analyse

      # The samples are part of the contract: each ships with tests, and they must stay
      # green with the SDK they sit on (the sample depends on this repo via a path repo).
      - name: Sample lint
        run: find samples -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Sample tests
        working-directory: samples/order-notifications
        run: |
          composer install --prefer-dist --no-progress
          composer test
